<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 730" width="1030" height="730">
  <defs>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#e6f4ff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background glow -->
  <ellipse cx="460" cy="340" rx="240" ry="200" fill="url(#glowGrad)"/>

  <!-- Outer ring -->
  <ellipse cx="460" cy="340" rx="220" ry="180" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.5"/>
  <ellipse cx="460" cy="340" rx="180" ry="145" fill="none" stroke="url(#ringGrad)" stroke-width="1" stroke-dasharray="4 8" opacity="0.4"/>

  <!-- Connection lines -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.35">
    <line x1="460" y1="340" x2="280" y2="175"/>
    <line x1="460" y1="340" x2="640" y2="170"/>
    <line x1="460" y1="340" x2="720" y2="315"/>
    <line x1="460" y1="340" x2="650" y2="505"/>
    <line x1="460" y1="340" x2="310" y2="515"/>
    <line x1="460" y1="340" x2="200" y2="340"/>
    <line x1="460" y1="340" x2="430" y2="145"/>
    <line x1="460" y1="340" x2="500" y2="545"/>
  </g>

  <!-- Core hexagon / shield -->
  <g filter="url(#softGlow)">
    <path d="M460 255 L530 295 L530 385 L460 425 L390 385 L390 295 Z" fill="url(#coreGrad)" stroke="#ffffff" stroke-width="1.5" opacity="0.95"/>
    <path d="M460 275 L510 305 L510 375 L460 405 L410 375 L410 305 Z" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- Inner core icon -->
  <g transform="translate(460, 340)">
    <circle r="28" fill="#ffffff" opacity="0.15"/>
    <circle r="20" fill="#ffffff" opacity="0.2"/>
    <path d="M0 -15 L12 -7.5 L12 7.5 L0 15 L-12 7.5 L-12 -7.5 Z" fill="#ffffff" opacity="0.85"/>
    <circle r="4" fill="#2b7fd3" opacity="0.9"/>
  </g>

  <!-- Orbiting nodes -->
  <g>
    <circle cx="430" cy="145" r="8" fill="url(#nodeGrad)" filter="url(#softGlow)"/>
    <circle cx="430" cy="145" r="3" fill="#ffffff" opacity="0.9"/>
    <circle cx="430" cy="145" r="16" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>

    <circle cx="640" cy="170" r="10" fill="url(#nodeGrad)" filter="url(#softGlow)"/>
    <circle cx="640" cy="170" r="4" fill="#ffffff" opacity="0.9"/>
    <circle cx="640" cy="170" r="20" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>

    <circle cx="720" cy="315" r="7" fill="url(#nodeGrad)"/>
    <circle cx="720" cy="315" r="3" fill="#ffffff" opacity="0.9"/>

    <circle cx="650" cy="505" r="9" fill="url(#nodeGrad)"/>
    <circle cx="650" cy="505" r="3.5" fill="#ffffff" opacity="0.9"/>

    <circle cx="310" cy="515" r="8" fill="url(#nodeGrad)"/>
    <circle cx="310" cy="515" r="3" fill="#ffffff" opacity="0.9"/>

    <circle cx="200" cy="340" r="10" fill="url(#nodeGrad)" filter="url(#softGlow)"/>
    <circle cx="200" cy="340" r="4" fill="#ffffff" opacity="0.9"/>
    <circle cx="200" cy="340" r="18" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>

    <circle cx="280" cy="175" r="7" fill="url(#nodeGrad)"/>
    <circle cx="280" cy="175" r="3" fill="#ffffff" opacity="0.9"/>

    <circle cx="500" cy="545" r="6" fill="url(#nodeGrad)"/>
    <circle cx="500" cy="545" r="2.5" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Data flow dots -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="340" cy="235" r="2"/>
    <circle cx="580" cy="235" r="2"/>
    <circle cx="640" cy="405" r="2"/>
    <circle cx="370" cy="435" r="2"/>
    <circle cx="280" cy="340" r="2"/>
    <circle cx="440" cy="205" r="2"/>
    <circle cx="550" cy="455" r="2"/>
  </g>

  <!-- Floating dots -->
  <g fill="#ffffff" opacity="0.25">
    <circle cx="150" cy="155" r="3"/>
    <circle cx="880" cy="195" r="2"/>
    <circle cx="820" cy="475" r="2.5"/>
    <circle cx="180" cy="535" r="3"/>
    <circle cx="900" cy="375" r="2"/>
    <circle cx="120" cy="425" r="1.5"/>
    <circle cx="750" cy="115" r="2"/>
  </g>

  <!-- Banner behind brand text -->
  <rect x="320" y="500" width="280" height="80" rx="40" ry="40" fill="#ffffff" opacity="0.12" stroke="#ffffff" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Brand text -->
  <text x="460" y="553" text-anchor="middle"
    style="font-size:44px;font-weight:bold;font-family:'Segoe UI',Arial,sans-serif;fill:#79bbff;letter-spacing:5px;">TAURUS</text>
</svg>
