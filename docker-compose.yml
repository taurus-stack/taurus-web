version: '3.8'

services:
  taurus-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taurus-web
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - taurus-network

networks:
  taurus-network:
    driver: bridge
